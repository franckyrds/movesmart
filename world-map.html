];

/* CHARGEMENT DYNAMIQUE DES BIBLIOTHÈQUES */

function loadScript(src) {

  return new Promise((resolve, reject) => {

    const script = document.createElement('script');

    script.src = src;
    script.async = true;

    script.onload = resolve;
    script.onerror = reject;

    document.body.appendChild(script);

  });

}

async function initGlobe() {

  try {

    await loadScript(
      'https://unpkg.com/three@0.180.0/build/three.min.js'
    );

    await loadScript(
      'https://unpkg.com/globe.gl@2.45.1/dist/globe.gl.min.js'
    );

    const wrapper = document.querySelector('.globe-wrapper');
    const container = document.getElementById('globeViz');

    const globe = Globe()(container)

      .globeImageUrl(
        'images/earth-blue-marble.webp'
      )

      .backgroundColor('rgba(0,0,0,0)')

      .width(wrapper.clientWidth)

      .height(wrapper.clientHeight)

      .pointsData(cities)

      .pointLat(d => d.lat)

      .pointLng(d => d.lng)

      .pointAltitude(0)

      .pointRadius(0.22)

      .pointResolution(
        window.innerWidth <= 900 ? 8 : 12
      )

      .pointColor(() => 'rgba(255,255,255,0.92)')

      .atmosphereColor('#60a5fa')

      .atmosphereAltitude(0.16)

      .pointLabel(d => `
        <div style="
          font-family:Poppins,sans-serif;
          padding:10px 14px;
          border-radius:16px;
          background:rgba(15,23,42,0.96);
          color:white;
          font-size:13px;
          font-weight:600;
          border:1px solid rgba(255,255,255,0.08);
          box-shadow:0 10px 30px rgba(0,0,0,0.35);
        ">
          ${d.name}
        </div>
      `)

      .onPointClick(d => {
        window.location.href = d.page;
      });

    /* Résolution WebGL limitée */

    const renderer = globe.renderer();

    renderer.setPixelRatio(
      window.innerWidth <= 900
        ? 1
        : Math.min(window.devicePixelRatio || 1, 1.5)
    );

    globe.pointOfView({
      lat:28,
      lng:12,
      altitude:1.95
    }, 0);

    const controls = globe.controls();

    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.rotateSpeed = 0.8;
    controls.zoomSpeed = 0.8;

    let resizeTimer;

    window.addEventListener('resize', () => {

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {

        globe
          .width(wrapper.clientWidth)
          .height(wrapper.clientHeight);

        renderer.setPixelRatio(
          window.innerWidth <= 900
            ? 1
            : Math.min(window.devicePixelRatio || 1, 1.5)
        );

      }, 150);

    });

  } catch (error) {

    console.error(
      'Impossible de charger le globe Vidolta :',
      error
    );

  }

}

/*
Le texte et la structure HTML s’affichent d’abord.
Le globe est ensuite chargé lorsque le navigateur est disponible.
*/

window.addEventListener('load', () => {

  if ('requestIdleCallback' in window) {

    requestIdleCallback(
      initGlobe,
      { timeout: 1200 }
    );

  } else {

    setTimeout(initGlobe, 200);

  }

});

</script>
